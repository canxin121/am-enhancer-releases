name: Build APK
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact private main commit (40 hex characters)
        required: true
        type: string
      publish:
        description: Publish APK only after distribution approval
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: apk-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'canxin121/amhifi-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: channel
          persist-credentials: false
      - name: Check inputs and credentials
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_KEY: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          SIGNING_KEY: ${{ secrets.APK_SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid source commit'; exit 1; }
          [[ -n "$SOURCE_KEY" && -n "$SIGNING_KEY" && -n "$SIGNING_PASSWORD" ]] || { echo 'Required private-source/signing secrets are not configured. See ci/SETUP.md.'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: canxin121/apple-music-usb-hifi
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Check trusted source lineage
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          git -C private-source merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          python3 private-source/tools/check_version.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build requirements
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;30.0.16248370' > "$RUNNER_TEMP/android-tools.log" 2>&1 || { echo 'Android toolchain installation failed'; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build, verify and prepare release
        env:
          SIGNING_KEY_B64: ${{ secrets.APK_SIGNING_KEYSTORE }}
          AMHIFI_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p private-source/signing
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > private-source/signing/lab-development.jks
          (cd private-source && bash tools/bootstrap-api.sh && bash build.sh) > "$RUNNER_TEMP/private-build.log" 2>&1 || { echo 'Android build failed. Private compiler output was not published.'; exit 1; }
          python3 channel/ci/package.py private-source "$RUNNER_TEMP/release"
      - name: Draft or publish verified deliverables
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: python3 channel/ci/publish.py "$RUNNER_TEMP/release"
      - name: Remove private build data
        if: always()
        run: |
          rm -rf private-source "$RUNNER_TEMP/private-build.log" "$RUNNER_TEMP/android-tools.log" "$RUNNER_TEMP/release"

name: Build APK
on:
  workflow_call:
    inputs:
      source_ref:
        description: Source main branch or an exact approved commit
        required: true
        type: string
      pipeline_commit:
        description: Pinned public pipeline commit
        required: true
        type: string
permissions:
  contents: write
jobs:
  android:
    if: github.repository == 'canxin121/apple-music-usb-hifi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate build inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          PIPELINE_COMMIT: ${{ inputs.pipeline_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == main || "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid source ref'; exit 1; }
          [[ "$PIPELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid pipeline commit'; exit 1; }
      - name: Checkout caller private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_ref }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Checkout pinned public pipeline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: canxin121/amhifi-releases
          ref: ${{ inputs.pipeline_commit }}
          path: channel
          persist-credentials: false
          show-progress: false
      - name: Verify source and frozen version
        id: source
        run: |
          set -euo pipefail
          git -C private-source merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 private-source/tools/check_version.py
          echo "commit=$(git -C private-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git -C private-source rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android toolchain
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          [[ -n "$SDKMANAGER" && -x "$SDKMANAGER" ]] || { echo 'Runner Android command-line tools not found'; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;30.0.16248370' > "$RUNNER_TEMP/android-tools.log" 2>&1 || { echo 'Android toolchain installation failed'; tail -20 "$RUNNER_TEMP/android-tools.log"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/30.0.16248370" >> "$GITHUB_ENV"
          cmake --version | head -1
          ninja --version
      - name: Compile and test three ABIs
        env:
          AMHIFI_UNSIGNED_ONLY: '1'
          AMHIFI_BUILD_JOBS: '4'
        run: |
          set -euo pipefail
          (cd private-source && bash tools/bootstrap-api.sh && bash build.sh) > "$RUNNER_TEMP/private-build.log" 2>&1 || { echo 'Android compilation failed. Private source was not uploaded.'; tail -60 "$RUNNER_TEMP/private-build.log"; exit 1; }
          grep -E 'assertions passed|checks passed|100% tests passed|Cloud compilation complete' "$RUNNER_TEMP/private-build.log"
      - name: Verify binary and package only deliverables
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          PIPELINE_COMMIT: ${{ inputs.pipeline_commit }}
        run: python3 channel/ci/verify_artifact.py private-source "$RUNNER_TEMP/deliverables" "$RUNNER_TEMP/private-build.log"
      - name: Save deliverables to existing private Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 channel/ci/upload_private_build.py "$RUNNER_TEMP/deliverables"
      - name: Remove source and build intermediates
        if: always()
        run: |
          rm -rf private-source "$RUNNER_TEMP/private-build.log" "$RUNNER_TEMP/android-tools.log" "$RUNNER_TEMP/deliverables"
